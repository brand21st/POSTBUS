openapi: 3.1.0
info:
  title: PostBus Merchant API
  version: v1
  description: >
    Public merchant API for PostBus. Authenticate with a scoped organization API key.
    Creating an order does not book India Post. Booking is a separate operation and may
    return queued/processing rather than BOOKED.
servers:
  - url: https://www.postbus.in/api/merchant/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Discovery
  - name: Orders
  - name: Shipments
paths:
  /me:
    get:
      tags: [Discovery]
      summary: API identity
      responses:
        "200":
          description: Key prefix, organization display name, scopes, capabilities
        "401":
          description: Invalid, revoked, or expired key
  /meta/schema:
    get:
      tags: [Discovery]
      summary: Curated public field contract
      responses:
        "200":
          description: Resources, fields, limits, scopes
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - in: query
          name: updated_since
          schema: { type: string, format: date-time }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: items and next_cursor
        "403":
          description: Missing orders:read
    post:
      tags: [Orders]
      summary: Create an order
      description: Requires Idempotency-Key. Source is always API. Does not book India Post.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Created
        "200":
          description: Idempotent replay
        "409":
          description: Idempotency conflict
        "422":
          description: Validation error
  /orders/bulk:
    post:
      tags: [Orders]
      summary: Import up to 25 orders
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orders]
              properties:
                orders:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    $ref: "#/components/schemas/CreateOrder"
      responses:
        "200":
          description: Per-row results; failed rows are never dropped silently
  /orders/{orderId}:
    get:
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200": { description: Order }
        "404": { description: Not found in this organization }
    patch:
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOrder"
      responses:
        "200": { description: Updated }
        "409": { description: Locked after booking }
  /orders/{orderId}/book:
    post:
      tags: [Shipments]
      summary: Request India Post booking
      description: Requires shipments:book and Idempotency-Key. Returns queued state; BOOKED only after India Post confirmation.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookOrder"
      responses:
        "202": { description: Booking accepted for processing }
        "409": { description: Booking not allowed }
  /shipments:
    get:
      tags: [Shipments]
      parameters:
        - in: query
          name: updated_since
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: order_id
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200": { description: items and next_cursor }
  /shipments/{shipmentId}:
    get:
      tags: [Shipments]
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      responses:
        "200": { description: Shipment }
  /shipments/{shipmentId}/tracking:
    get:
      tags: [Shipments]
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      responses:
        "200":
          description: Cached PostBus tracking; may enqueue a background refresh when stale
  /shipments/{shipmentId}/label:
    get:
      tags: [Shipments]
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404": { description: Label not generated yet }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
    ShipmentId:
      in: path
      name: shipmentId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Address:
      type: object
      required: [line1, city, state, pincode]
      properties:
        name: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: "^\\d{6}$" }
        country: { type: string, default: IN }
    CreateOrder:
      type: object
      required: [customer, shipping_address, line_items]
      properties:
        external_order_id: { type: string, maxLength: 120 }
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
        shipping_address:
          $ref: "#/components/schemas/Address"
        billing_same_as_shipping: { type: boolean }
        billing_address:
          $ref: "#/components/schemas/Address"
        payment_status:
          type: string
          enum: [PENDING, PAID, PARTIAL, COD, REFUNDED, FAILED]
        amount_paid: { type: number }
        extra_cod_charge: {}
        metadata: { type: object, additionalProperties: true }
        line_items:
          type: array
          minItems: 1
          items:
            type: object
            required: [quantity]
            properties:
              product_id: { type: string, format: uuid }
              title: { type: string }
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
              unit_price: { type: number }
              weight_grams: { type: integer }
        india_post_service:
          type: string
          enum: [SP_INLAND_PARCEL, BUSINESS_PARCEL]
    PatchOrder:
      type: object
      properties:
        shipping_address:
          $ref: "#/components/schemas/Address"
        parcel_weight_mode:
          type: string
          enum: [auto, manual]
        parcel_weight_grams: { type: integer }
        line_items:
          type: array
          items:
            type: object
            required: [id, weight_grams]
            properties:
              id: { type: string, format: uuid }
              weight_grams: { type: integer }
              weight_mode:
                type: string
                enum: [auto, manual]
    BookOrder:
      type: object
      properties:
        weight_grams: { type: integer }
        length_cm: { type: number }
        width_cm: { type: number }
        height_cm: { type: number }
        service_code:
          type: string
          enum: [SP_INLAND_PARCEL, BUSINESS_PARCEL]
