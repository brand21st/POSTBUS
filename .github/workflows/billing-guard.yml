name: Billing guard

# Blocks merging or deploying billing code that can grant paid access without a
# verified, captured Razorpay payment. Before pointing Coolify at a commit, run
# `node scripts/ci/billing-guard.mjs --ref <sha>` locally as well.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  billing-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Static billing guard
        run: node scripts/ci/billing-guard.mjs
      - name: Install dependencies
        # Same as the Dockerfile: package-lock.json is not fully in sync with
        # package.json, so `npm ci` refuses to install.
        run: npm install --no-audit --no-fund
      - name: Billing regression tests
        run: npm run verify:billing
